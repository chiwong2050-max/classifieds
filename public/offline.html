<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline · ListNear</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="container" style="display:grid;place-items:center;min-height:80vh;text-align:center;">
    <div class="card card-pad" style="max-width:40ch;">
      <h1>You're offline</h1>
      <p class="muted">Check your connection and try again. Listings need a live connection to stay fresh.</p>
      <button class="btn btn-primary" onclick="location.reload()">Retry</button>
    </div>
  </main>
</body>
</html>
